global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: mern-todo

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Chinh Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # PHAN CUNG VPS: CPU / RAM / Disk / Network
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: "vps-todo" }

  # Tai nguyen tung container Docker
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # TRANG THAI DATABASE MongoDB
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  # Metric ung dung (Node.js + tinh trang ket noi DB)
  - job_name: todo-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Probe HTTP: kiem tra frontend/backend con song khong
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:80/healthz
          - http://backend:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
