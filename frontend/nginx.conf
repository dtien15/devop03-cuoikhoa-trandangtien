server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nen gzip cho tai nguyen tinh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck cho docker / prometheus blackbox
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy API sang container backend (service name trong docker network)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache tai nguyen co hash trong ten file
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: moi route deu tra ve index.html cho react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
