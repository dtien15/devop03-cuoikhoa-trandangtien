#cloud-config
# Cai san nhung thu toi thieu ngay khi droplet khoi dong.
# Phan cai dat chi tiet do Ansible dam nhiem.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - python3
  - python3-pip

write_files:
  - path: /etc/sysctl.d/99-todo.conf
    content: |
      vm.max_map_count=262144
      vm.swappiness=10

runcmd:
  # --- Tao swap 2G (Prometheus + Jenkins + build khong bi OOM) ---
  - [ sh, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile" ]
  - [ sh, -c, "echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ sysctl, --system ]

  # --- Tuong lua ---
  - [ ufw, allow, "22/tcp" ]
  - [ ufw, allow, "80/tcp" ]
  - [ ufw, allow, "443/tcp" ]
  - [ sh, -c, "ufw --force enable" ]

  # --- Docker Engine + Compose plugin ---
  - [ sh, -c, "curl -fsSL https://get.docker.com | sh" ]
  - [ systemctl, enable, --now, docker ]

  - [ systemctl, enable, --now, fail2ban ]
  - [ sh, -c, "echo 'cloud-init da chay xong' > /var/log/todo-bootstrap.done" ]

final_message: "VPS san sang sau $UPTIME giay. Chay Ansible o buoc tiep theo."
