---
- name: Kiem tra Docker da co chua
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Cai Docker Engine + Compose plugin
  when: docker_check.rc != 0
  block:
    - name: Tai script cai dat chinh chu
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Chay script cai dat
      ansible.builtin.command: sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

- name: Bat dich vu docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Cau hinh Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true,
        "features": { "containerd-snapshotter": false }
      }
  notify: Khoi dong lai docker

# Vi sao tat containerd-snapshotter:
# Docker 29 mac dinh dung kho anh containerd (driver "overlayfs"), khien
# /var/lib/docker/image/<driver>/layerdb khong con ton tai. cAdvisor doc theo
# layout cu nen bao "failed to identify the read-write layer ID" va bo qua
# TOAN BO container -> khong co metric CPU/RAM tung container.
# Tat co nay dua Docker ve kho anh overlay2 truyen thong, cAdvisor doc duoc.

- name: Ap dung cau hinh daemon ngay (cac role sau can kho anh dung)
  ansible.builtin.meta: flush_handlers

- name: Dang nhap GitHub Container Registry
  community.docker.docker_login:
    registry_url: "{{ registry }}"
    username: "{{ vault_ghcr_username }}"
    password: "{{ vault_ghcr_token }}"
    reauthorize: true
  when: vault_ghcr_token | default('') | length > 0
  no_log: true

- name: Don rac Docker hang tuan bang cron
  ansible.builtin.cron:
    name: "docker system prune"
    weekday: "0"
    hour: "3"
    minute: "0"
    job: "/usr/bin/docker system prune -af --filter 'until=168h' >> /var/log/docker-prune.log 2>&1"
