# ============================================================
#  CI/CD: build -> day image len GHCR -> deploy sang VPS
# ============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy sang VPS sau khi build"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Kiem tra ma nguon ----------
  lint-and-build:
    name: Lint & build thu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Cai dependencies backend
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Kiem tra cu phap backend
        working-directory: backend
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done
          echo "Cu phap backend OK"

      - name: Cai dependencies frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_URL: /api
        run: npm run build

      - name: Kiem tra cu phap file docker-compose
        run: |
          docker compose -f docker-compose.yml config -q
          echo "docker-compose.yml OK"

  # ---------- 2. Build image va day len GHCR ----------
  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: lint-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Chuyen ten repo ve chu thuong
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Dang nhap GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag va label
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build va push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_API_URL=/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------- 3. Quet lo hong (khong chan pipeline) ----------
  security-scan:
    name: Quet lo hong image
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Chuyen ten repo ve chu thuong
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Chay thang trivy bang Docker thay vi dung trivy-action:
      # loi hien ro trong log, khong phu thuoc lop cache cua action.
      - name: Trivy scan
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-${{ matrix.service }}:latest
          # Trivy tu dang nhap registry de keo duoc image private
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Lay DB tu mirror AWS ECR de tranh bi ghc.io gioi han luot tai
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        run: |
          set -o pipefail
          docker run --rm             -e TRIVY_USERNAME -e TRIVY_PASSWORD             -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY             -v /tmp/trivy-cache:/root/.cache/trivy             aquasec/trivy:latest image               --severity HIGH,CRITICAL               --ignore-unfixed               --scanners vuln               --timeout 10m               --exit-code 0               "$IMAGE" | tee trivy-${{ matrix.service }}.txt

      - name: Dua ket qua vao phan Summary
        if: always()
        run: |
          {
            echo "## Trivy - ${{ matrix.service }}"
            echo '```'
            tail -c 60000 trivy-${{ matrix.service }}.txt 2>/dev/null || echo "(khong co ket qua)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Luu bao cao
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: ignore

  # ---------- 4. Deploy sang VPS ----------
  deploy:
    name: Deploy len VPS
    needs: build-and-push
    # Chi deploy khi da dung xong VPS: vao Settings > Secrets and variables >
    # Actions > Variables, them DEPLOY_ENABLED = true
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH vao VPS va cap nhat stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/todo-app
            echo "==> Cap nhat ma nguon"
            git fetch --all
            git reset --hard origin/main
            echo "==> Keo image moi tu GHCR"
            docker compose -f docker-compose.prod.yml pull backend frontend
            echo "==> Khoi chay lai"
            docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d --remove-orphans
            echo "==> Don rac"
            docker image prune -f

      - name: Kiem tra ung dung song sau deploy
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.APP_DOMAIN || 'todo.muatheme247.com' }}" || true)
            echo "Lan $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Ung dung chua tra ve 200 sau khi deploy"
          exit 1
